      - file: packages/desktop/src/preload/index.ts
        symbol: getOfflineDataBackupState
      - file: packages/desktop/src/renderer/src/desktopPlatform.ts
        symbol: createDesktopPlatform
    invariants:
      - Main authorizes both reads and broadcasts with registered application webContents IDs;
        non-offline disabled snapshots use the same admission boundary.
      - The optional platform methods expose snapshot and change events only, not lifecycle controls.
  - id: state.renderer-offline-backup-projection
