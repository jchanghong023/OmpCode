    aliases:
      - Main backup owner
      - 离线备份生命周期
      - 备份调度
    codeSeeds:
      - file: packages/desktop/src/main/offlineDataBackupLifecycle.ts
        symbol: createOfflineDataBackupLifecycle
      - file: packages/desktop/src/main/index.ts
        symbol: getOfflineDataBackupSnapshot
    invariants:
      - Main is the only lifecycle owner; diagnostics and renderers do not maintain another scheduler.
      - Commit state before broadcasting and starting work; only completed changes lastSuccessfulAt.
      - The schedule advances on fixed periods; overlapping rounds remain running, and stop clears
        the schedule and ignores late results without a synchronous backup.
      - Snapshot reads use in-memory or lexical local facts and do not enumerate profile directories.
  - id: boundary.offline-backup-platform-read
