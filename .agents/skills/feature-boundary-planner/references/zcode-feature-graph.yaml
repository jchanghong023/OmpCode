    label: Renderer read-only backup snapshot projection
    codeSeeds:
      - file: packages/ui/src/hooks/useOfflineDataBackupState.ts
        symbol: useOfflineDataBackupState
    invariants:
      - Subscribe before reading; revision and platform-generation fences reject stale replies.
      - Missing Web capability is unavailable, not a fabricated disabled snapshot; read errors do not
        change Main's backup phase to failed.
      - Refresh rereads the snapshot without polling, scanning directories, sending RendererReady
        or triggering backup work.
