name: Release Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-windows-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
    env:
      ZCODE_ENV: production
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      OMP_ARTIFACT_REPOSITORY: ${{ vars.OMP_ARTIFACT_REPOSITORY }}
      OMP_ARTIFACT_RUN_ID: ${{ vars.OMP_ARTIFACT_RUN_ID }}
      OMP_ARTIFACT_COMMIT: ${{ vars.OMP_ARTIFACT_COMMIT }}
      OMP_ARTIFACT_TOKEN: ${{ secrets.OMP_ARTIFACT_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Require release branch
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/dev-centos7') { throw 'Windows releases must run from dev-centos7.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Validate pinned inputs and release tag
        id: release_meta
        shell: pwsh
        run: |
          node scripts/publish/fetch-omp-artifact.mjs check
          if ($LASTEXITCODE -ne 0) { throw 'Invalid pinned OMP producer run.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$([DateTime]::UtcNow.ToString('yyyyMMdd-HHmmss'))-${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          git check-ref-format "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag.' }
          $existing = git ls-remote --tags "https://github.com/$env:GITHUB_REPOSITORY.git" "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Could not check remote release tags.' }
          if ($existing) { throw "Release tag already exists: $tag" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Install normal frozen dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare required installed runtime assets without root prepare gate
        shell: pwsh
        run: |
          node packages/desktop/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron installation failed.' }
          pnpm --filter @zcode/desktop exec node scripts/node-pty-rebuild.mjs
          if ($LASTEXITCODE -ne 0) { throw 'node-pty preparation failed.' }
      - name: Download and verify pinned Windows OMP
        shell: pwsh
        run: node scripts/publish/fetch-omp-artifact.mjs download win32-x64 "$env:RUNNER_TEMP/omp-release"
      - name: Build unsigned production Windows installer
        run: pnpm bundle:desktop -- --os=win --arch=x64
      - name: Prepare unique installer and checksum
        shell: pwsh
        run: |
          $dist = 'packages/desktop/dist'
          $name = "OmpCode-$env:APP_VERSION-win-x64.exe"
          $installers = @(Get-ChildItem -LiteralPath $dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Name -ne $name) { throw 'Expected exactly the named Windows installer.' }
          $installer = $installers[0]
          if ($installer.Length -lt 50MB) { throw 'Installer is unexpectedly small.' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $dist "$name.sha256"), "$hash  $name`n", [System.Text.Encoding]::ASCII)
          "Unsigned Windows x64 installer; ZCode source $env:GITHUB_SHA. Target runtime has not been acceptance-tested by this workflow." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            packages/desktop/dist/OmpCode-*-win-x64.exe
            packages/desktop/dist/OmpCode-*-win-x64.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
      - name: Verify downloaded installer
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          assets=(OmpCode-*-win-x64.exe)
          [[ ${#assets[@]} -eq 1 && -s ${assets[0]} ]]
          [[ $(stat -c %s "${assets[0]}") -ge 52428800 ]]
          sha256sum --check "${assets[0]}.sha256"
      - name: Create draft release
        shell: bash
        run: |
          set -euo pipefail
          assets=(release-assets/OmpCode-*-win-x64.exe)
          gh release create "$RELEASE_TAG" "${assets[0]}" "${assets[0]}.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OmpCode $RELEASE_TAG" \
            --notes "Windows x64 installer; unsigned. Source: $GITHUB_SHA. Packaging integrity only; no runtime acceptance tests executed." --generate-notes --draft
      - name: Verify uploaded bytes and promote draft
        shell: bash
        run: |
          set -euo pipefail
          assets=(release-assets/OmpCode-*-win-x64.exe)
          metadata=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft)
          [[ $(jq -r '.isDraft' <<< "$metadata") == true ]]
          [[ $(jq '.assets | length' <<< "$metadata") -eq 2 ]]
          for file in "${assets[0]}" "${assets[0]}.sha256"; do
            actual=$(jq -r --arg name "$(basename "$file")" '.assets[] | select(.name == $name) | .size' <<< "$metadata")
            [[ "$actual" == "$(stat -c %s "$file")" ]]
          done
          mkdir uploaded
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir uploaded
          (cd uploaded && sha256sum --check *.sha256)
          cmp "${assets[0]}.sha256" "uploaded/$(basename "${assets[0]}.sha256")"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url --jq 'select(.isDraft == false) | .url'
