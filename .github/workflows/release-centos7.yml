name: Release CentOS 7 ZIP

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag; leave blank to generate one automatically"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: true
        default: false
        type: boolean

concurrency:
  group: release-centos7-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      app_version: ${{ steps.release_meta.outputs.app_version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate release target
        id: release_meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'CentOS 7 releases must run from main.' >&2; exit 1; }
          version=$(node -p 'require("./package.json").version')
          release_tag=${REQUESTED_TAG:-"v${version}-centos7-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"}
          git check-ref-format "refs/tags/$release_tag" || { echo "Invalid release tag: $release_tag" >&2; exit 1; }
          existing_tag=$(git ls-remote --tags origin "refs/tags/$release_tag") || { echo 'Could not check existing release tags.' >&2; exit 1; }
          [[ -z "$existing_tag" ]] || { echo "Tag $release_tag already exists." >&2; exit 1; }
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $release_tag" >> "$GITHUB_STEP_SUMMARY"

  desktop:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ZCODE_ENV: production
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_TARGET_OS: linux
      ZCODE_TARGET_ARCH: x64
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Switch to CentOS 7 build state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-centos7-build.mjs apply

      - name: Install desktop build dependencies
        shell: bash
        run: |
          set -euo pipefail
          # 切换后的 manifest 与仓库 lockfile 不一致，必须 --no-frozen-lockfile；
          # 切换脚本全精确钉版保证解析可重现（C1 实证：services/server undici 必须与 desktop 同钉 6.23.0）。
          pnpm install --no-frozen-lockfile

      - name: Build Linux desktop
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsc -b packages/shared
          pnpm build:bootstrap
          pnpm prepare:desktop-runtime
          chmod +x packages/desktop/bundled-agents/linux-x64/glm/omp/omp
          [[ -f packages/desktop/out/renderer/index.html ]]
          pnpm --filter @zcode/desktop exec electron-builder --config electron-builder.config.js --linux --x64 --dir --publish never
          pnpm --filter @zcode/desktop exec node -e 'const asar = require("@electron/asar"); if (!asar.extractFile("dist/linux-unpacked/resources/app.asar", "out/renderer/index.html").length) process.exit(1)'

      - name: Archive desktop stage
        shell: bash
        run: |
          set -euo pipefail
          tar -C packages/desktop/dist -cf "$RUNNER_TEMP/linux-unpacked.tar" linux-unpacked

      - uses: actions/upload-artifact@v4
        with:
          name: centos7-desktop-stage
          path: ${{ runner.temp }}/linux-unpacked.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ZCODE_ENV: production
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      ZCODE_TARGET_OS: linux
      ZCODE_TARGET_ARCH: x64
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Switch to CentOS 7 build state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-centos7-build.mjs apply

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          # 与 desktop job 相同：切换后 manifest 与 lockfile 不一致，须 --no-frozen-lockfile。
          pnpm install --no-frozen-lockfile

      - name: Prepare pinned CentOS 7 native toolchain
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/centos7-native-tools"
          mkdir -p "$tools/bin"
          curl -fL --retry 3 -o "$tools/node.tar.xz" \
            https://unofficial-builds.nodejs.org/download/release/v20.19.0/node-v20.19.0-linux-x64-glibc-217.tar.xz
          echo 'b06697853d80cbc2ca77408276a26234a83e9587a32a77161df2215cc3889a7f  '"$tools/node.tar.xz" | sha256sum --check
          tar -xJf "$tools/node.tar.xz" --strip-components=1 -C "$tools"
          npm install --prefix "$tools/pnpm" --no-save --ignore-scripts --no-audit --no-fund pnpm@10.33.2
          cat > "$tools/bin/pnpm" <<'PNPM'
          #!/bin/sh
          exec /toolchain/bin/node /toolchain/pnpm/node_modules/pnpm/bin/pnpm.cjs "$@"
          PNPM
          chmod +x "$tools/bin/pnpm"

      - name: Build glibc 2.17 native addons and search tools
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/centos7-native-tools:/toolchain" \
            --workdir /workspace \
            quay.io/pypa/manylinux2014_x86_64:latest \
            bash -ceu '
              cat > /etc/yum.repos.d/centos7-native-vault.repo <<EOF
          [centos7-base]
          name=CentOS 7 vault base
          baseurl=https://vault.centos.org/7.9.2009/os/x86_64/
          enabled=1
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
          [centos7-updates]
          name=CentOS 7 vault updates
          baseurl=https://vault.centos.org/7.9.2009/updates/x86_64/
          enabled=1
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
          [centos7-extras]
          name=CentOS 7 vault extras
          baseurl=https://vault.centos.org/7.9.2009/extras/x86_64/
          enabled=1
          gpgcheck=1
          gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-7
          [centos7-sclo-rh]
          name=CentOS 7 vault GCC 11
          baseurl=https://vault.centos.org/7.9.2009/sclo/x86_64/rh/
          enabled=1
          gpgcheck=1
          gpgkey=https://www.centos.org/keys/RPM-GPG-KEY-CentOS-SIG-SCLo
          EOF
              yum --disablerepo="*" --enablerepo="centos7-*" install -y \
                devtoolset-11-gcc devtoolset-11-gcc-c++ file make binutils
              export PATH="/toolchain/bin:/opt/python/cp311-cp311/bin:$PATH"
              export PYTHON=/opt/python/cp311-cp311/bin/python3.11
              bash scripts/publish/centos7/build-native-assets.sh
            '

      - name: Verify CentOS 7 native assets
        shell: bash
        run: |
          set -euo pipefail
          native=packages/desktop/dist/centos7-native
          for binary in \
            app/node_modules/better-sqlite3/build/Release/better_sqlite3.node \
            app/node_modules/node-pty/prebuilds/linux-x64/pty.node \
            app/node_modules/cpu-features/build/Release/cpufeatures.node \
            app/resources/tools/bfs/bfs \
            app/resources/tools/ugrep/ugrep; do
            [[ -s "$native/$binary" ]] || { echo "Missing native asset: $binary" >&2; exit 1; }
          done
          python3 scripts/publish/centos7/verify-elf.py "$native"

      - name: Archive native stage
        shell: bash
        run: |
          set -euo pipefail
          tar -C packages/desktop/dist -cf "$RUNNER_TEMP/centos7-native.tar" centos7-native

      - uses: actions/upload-artifact@v4
        with:
          name: centos7-native-stage
          path: ${{ runner.temp }}/centos7-native.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package:
    needs: [preflight, desktop, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ needs.preflight.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zip unzip
          pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: centos7-desktop-stage
          path: release-inputs

      - uses: actions/download-artifact@v4
        with:
          name: centos7-native-stage
          path: release-inputs

      - name: Extract build stages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/desktop/dist
          tar -C packages/desktop/dist -xf release-inputs/linux-unpacked.tar
          tar -C packages/desktop/dist -xf release-inputs/centos7-native.tar

      - name: Build ZIP and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/desktop/dist
          bash scripts/publish/centos7/build-zip.sh \
            packages/desktop/dist/linux-unpacked packages/desktop/dist/centos7-native \
            "$APP_VERSION" packages/desktop/dist
          archive="packages/desktop/dist/OmpCode-$APP_VERSION-centos7-x64.zip"
          [[ -s "$archive" ]]
          unzip -tqq "$archive"
          (cd packages/desktop/dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: centos7-release
          path: |
            packages/desktop/dist/OmpCode-*-centos7-x64.zip
            packages/desktop/dist/OmpCode-*-centos7-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [preflight, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      IS_PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: centos7-release
          path: release-assets

      - name: Verify downloaded assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          assets=(OmpCode-*-centos7-x64.zip)
          [[ ${#assets[@]} -eq 1 && -f ${assets[0]} ]]
          sha256sum --check "${assets[0]}.sha256"

      - name: Create draft release with ZIP
        shell: bash
        run: |
          set -euo pipefail
          assets=(release-assets/OmpCode-*-centos7-x64.zip)
          [[ ${#assets[@]} -eq 1 && -f ${assets[0]} ]]
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "OmpCode $RELEASE_TAG" --notes 'Native CentOS 7 x64 offline ZIP (glibc 2.17). Extract under HOME and run bin/ompcode-centos7 without root or PRoot. Chromium sandboxing is disabled.' --generate-notes --draft)
          if [[ "$IS_PRERELEASE" == 'true' ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${assets[0]}" "${assets[0]}.sha256" "${args[@]}"

      - name: Verify assets and publish release
        shell: bash
        run: |
          set -euo pipefail
          archive=(release-assets/OmpCode-*-centos7-x64.zip)
          expected_size=$(stat -c %s "${archive[0]}")
          release_json=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets,isDraft)
          [[ $(jq -r '.isDraft' <<< "$release_json") == 'true' ]]
          actual_size=$(jq -r --arg name "$(basename "${archive[0]}")" '.assets[] | select(.name == $name) | .size' <<< "$release_json")
          [[ "$actual_size" == "$expected_size" ]]
          jq -r '.assets[].name' <<< "$release_json" | grep -Fx "$(basename "${archive[0]}.sha256")"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,url --jq 'select(.isDraft == false) | .url'
