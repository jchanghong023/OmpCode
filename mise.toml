[tools]
node = "24.14.0"
pnpm = "10.33.2"

[env]
COREPACK_ENABLE_PROJECT_SPEC = "0"
ELECTRON_MIRROR = "https://npmmirror.com/mirrors/electron/"

[tasks.install]
description = "Install root workspace dependencies with the pinned pnpm."
run = "mise exec -- node scripts/mise-run.mjs pnpm install"

[tasks.bootstrap]
description = "Run the repository bootstrap script after installing dependencies."
depends = ["install"]
run = "mise exec -- node scripts/mise-run.mjs pnpm bootstrap"

[tasks.dev]
description = "Start the desktop app in an isolated local test environment."
env = { ZCODE_DATA_BASE_DIR = "{{env.HOME}}/.zcode-dev-home" }
run = "mise exec -- node scripts/mise-run.mjs pnpm dev:desktop:test"

[tasks.dev-desktop-prod]
description = "Start the desktop app against the production environment."
run = "mise exec -- node scripts/mise-run.mjs pnpm dev:desktop:prod"

[tasks.dev-web]
description = "Start the server and web client dev servers."
run = "mise exec -- node scripts/mise-run.mjs pnpm dev:web"

[tasks.typecheck]
description = "Run the root TypeScript project references check."
run = "mise exec -- node scripts/mise-run.mjs pnpm typecheck"

[tasks.lint]
description = "Run the root linter."
run = "mise exec -- node scripts/mise-run.mjs pnpm lint"

[tasks.fastcheck]
description = "Run static/format/compile checks only; non-compilation budget at most 60 seconds."
run = "mise exec -- node scripts/mise-run.mjs pnpm fastcheck"

[tasks.fulltest]
description = "Run all Windows checks/tests; non-compilation budget 900 seconds; explicit run or active gate-skill authorization required."
run = "mise exec -- node scripts/mise-run.mjs pnpm fulltest"

[tasks.slowtest]
description = "Run the Windows fulltest plan once; no applicable WSL extension, CI or release; non-compilation budget 1500 seconds; authorization required."
run = "mise exec -- node scripts/mise-run.mjs pnpm slowtest"
